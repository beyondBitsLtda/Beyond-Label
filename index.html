<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Whiteboard Criativo Infinito</title>

  <!-- Tipografia: sans neutra + mono para código + fontes manuscritas
       para os elementos de boas-vindas. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Homemade+Apple&family=Caveat:wght@400;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">

  <!-- Aplica o tema salvo antes do primeiro paint (evita "flash" do claro). -->
  <script>
    try {
      var t = localStorage.getItem('whiteboard:theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>

  <link rel="stylesheet" href="styles.css">
  <!-- Patches: temas + estilos das novas funcionalidades. DEPOIS de styles.css. -->
  <link rel="stylesheet" href="patches.css">

  <!-- ═════════════════════════════════════════════════════════════════
       IMPORT MAP — força uma única instância de cada pacote CodeMirror.
       ═════════════════════════════════════════════════════════════════ -->
  <script type="importmap">
  {
    "imports": {
      "@codemirror/state":           "https://esm.sh/@codemirror/state@6.4.1",
      "@codemirror/view":            "https://esm.sh/@codemirror/view@6.26.3?external=@codemirror/state",
      "@codemirror/language":        "https://esm.sh/@codemirror/language@6.10.1?external=@codemirror/state,@codemirror/view",
      "@codemirror/commands":        "https://esm.sh/@codemirror/commands@6.5.0?external=@codemirror/state,@codemirror/view,@codemirror/language",
      "@codemirror/autocomplete":    "https://esm.sh/@codemirror/autocomplete@6.15.0?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/commands",
      "@codemirror/lint":            "https://esm.sh/@codemirror/lint@6.6.0?external=@codemirror/state,@codemirror/view",
      "@codemirror/search":          "https://esm.sh/@codemirror/search@6.5.6?external=@codemirror/state,@codemirror/view",
      "@codemirror/theme-one-dark":  "https://esm.sh/@codemirror/theme-one-dark@6.1.2?external=@codemirror/state,@codemirror/view,@codemirror/language",
      "@lezer/highlight":            "https://esm.sh/@lezer/highlight@1.2.0",
      "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript@6.2.2?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@codemirror/lint,@lezer/highlight",
      "@codemirror/lang-html":       "https://esm.sh/@codemirror/lang-html@6.4.9?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@codemirror/lint,@codemirror/lang-javascript,@codemirror/lang-css,@lezer/highlight",
      "@codemirror/lang-css":        "https://esm.sh/@codemirror/lang-css@6.2.1?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@codemirror/lint,@lezer/highlight",
      "@codemirror/lang-sql":        "https://esm.sh/@codemirror/lang-sql@6.6.4?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@codemirror/lint,@lezer/highlight",
      "sql.js":                      "https://esm.sh/sql.js@1.10.3"
    }
  }
  </script>
</head>
<body>
  <!-- VIEWPORT: captura pan/zoom/clique direito. WORLD: plano infinito. -->
  <div id="viewport" class="viewport">
    <div id="world" class="world">
      <!-- Cards são injetados aqui via JS -->
    </div>
  </div>

  <header class="hud hud--topleft">
    <span class="hud__mark">◍</span>
    <span class="hud__title">Canvas</span>
  </header>

  <div class="hud hud--topright">
    <button id="proj-toggle" class="hud__btn hud__btn--text" title="Projetos">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" style="vertical-align:-1px;margin-right:4px;">
        <rect x="2" y="3"  width="12" height="3" rx="0.8" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <rect x="2" y="10" width="12" height="3" rx="0.8" stroke="currentColor" stroke-width="1.2" fill="none"/>
      </svg>projetos</button>
    <span class="hud__sep"></span>
    <button id="sb-toggle" class="hud__btn hud__btn--text" title="Modo Storyboard · Lente do Diretor">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" style="vertical-align:-1px;margin-right:4px;">
        <rect x="1"  y="4" width="6" height="8" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <rect x="9"  y="4" width="6" height="8" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/>
      </svg>storyboard</button>
    <span id="sb-count" class="hud__count"></span>
    <button id="sb-play" class="hud__btn" title="Play fly-through" hidden>
      <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M4 2l10 6L4 14z" fill="currentColor"/></svg>
    </button>
    <span class="hud__sep"></span>
    <button id="connect-toggle" class="hud__btn hud__btn--text" title="Conectar cards (L) · clique origem e destino">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" style="vertical-align:-1px;margin-right:4px;">
        <circle cx="3.5" cy="3.5" r="2" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <circle cx="12.5" cy="12.5" r="2" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M5 5l6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>conectar</button>
    <span class="hud__sep"></span>
    <button id="collab-toggle" class="hud__btn hud__btn--text" title="Colaborar em tempo real">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" style="vertical-align:-1px;margin-right:4px;">
        <circle cx="5.5" cy="5" r="2.2" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <circle cx="11" cy="6.5" r="1.8" stroke="currentColor" stroke-width="1.2" fill="none"/>
        <path d="M1.5 13c0-2 1.8-3.4 4-3.4S9.5 11 9.5 13M9.5 11.5c.4-1.3 1.6-2.1 3-2.1s2.5.8 2.9 2.1" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg>colaborar</button>
    <span class="hud__sep"></span>
    <!-- Login/sync (Supabase). O módulo preenche este slot se estiver configurado. -->
    <span id="auth-slot"></span>
  </div>

  <div class="hud hud--bottomright">
    <button id="zoom-out" class="hud__btn" title="Zoom out (−)">−</button>
    <span id="zoom-level" class="hud__zoom">100%</span>
    <button id="zoom-in" class="hud__btn" title="Zoom in (+)">+</button>
    <span class="hud__sep"></span>
    <button id="zoom-reset" class="hud__btn hud__btn--text" title="Voltar à origem (0)">Reset</button>
  </div>

  <div id="hint" class="hint">
    <kbd>clique direito</kbd> criar  ·  <kbd>arraste / scroll</kbd> mover  ·  <kbd>Ctrl+scroll</kbd> zoom  ·  <kbd>P</kbd> caneta  ·  <kbd>arrastar imagens</kbd> aqui
  </div>

  <div id="context-menu" class="context-menu" hidden>
    <!-- Itens injetados via JS -->
  </div>

  <!-- ────────────────────────────────────────────────────────────────
       SCRIPTS — módulos ES, sem framework.
       IMPORTANTE: SEM query string (?v=) nas tags. Query string na tag
       de entrada faz o navegador tratar o módulo como uma instância
       DIFERENTE dos imports por caminho relativo (./canvas.js), criando
       DUAS cópias de canvas.js — uma que recebe os eventos de pan/zoom e
       outra (a importada) que fica congelada. Era a causa do "zoom
       perdendo a referência" e de cards nascendo na posição errada.
       ──────────────────────────────────────────────────────────────── -->
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/canvas.js"></script>
  <script type="module" src="js/cards.js"></script>
  <script type="module" src="js/media.js"></script>
  <script type="module" src="js/freetext.js"></script>
  <script type="module" src="js/drawing.js"></script>
  <script type="module" src="js/ide.js"></script>
  <script type="module" src="js/db.js"></script>
  <script type="module" src="js/uml.js"></script>
  <script type="module" src="js/storyboard.js"></script>
  <script type="module" src="js/minimap.js"></script>
  <script type="module" src="js/templates.js"></script>
  <script type="module" src="js/projects.js"></script>
  <script type="module" src="js/connections.js"></script>
  <script type="module" src="js/search.js"></script>
  <script type="module" src="js/stickers.js"></script>
  <script type="module" src="js/contextMenu.js"></script>
  <script type="module" src="js/persistence.js"></script>
  <script type="module" src="js/collab.js"></script>
  <script type="module" src="js/chat.js"></script>
  <script type="module" src="js/supabase.js"></script>
  <script type="module" src="js/app.js"></script>

  <!-- Wireup do botão "colaborar" (usa modal customizado). -->
  <script type="module">
    import { confirmModal } from './js/modal.js';
    const btn = document.getElementById('collab-toggle');
    if (btn) {
      btn.addEventListener('click', async () => {
        const active = window.__collab?.isActive?.();
        if (active) {
          const link = window.__collab.getShareLink();
          try {
            await navigator.clipboard.writeText(link);
          } catch {}
          alert('Link da sessão copiado!\n\nEnvie para um colega (mesma rede):\n\n' + link);
        } else {
          const ok = await confirmModal({
            title: 'Iniciar colaboração?',
            message: 'Um link será gerado. Quem tiver o link (na mesma rede) edita junto com você em tempo real.',
            confirmText: 'Iniciar',
          });
          if (ok) window.__collab?.start?.();
        }
      });
      if (window.__collab?.isActive?.()) btn.classList.add('is-active');
    }
  </script>
</body>
</html>
